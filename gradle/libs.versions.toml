[versions]
agp = "8.5.0"
kotlin-version = "2.1.0"
ktlint-version = "11.6.1"
detekt-version = "1.23.1"
dokka-version = "2.0.0" # "2.0.0-Beta"
kover-version = "0.7.4"
compatbility-validator = "0.16.2"

android-minSdk = "24"
android-compileSdk = "34"

[libraries]
gradlePlugin-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover-version" }
gradlePlugin-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka-version" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-version" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt-version" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka-version" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin-version"}
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover-version" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "compatbility-validator"}
